# Настройки DesktopPet.
# Файл можно редактировать вручную — изменения применятся
# при следующем запуске приложения.

# Масштаб спрайта. 0.5 — вдвое меньше, 1.0 — как в PNG, 1.5 — крупнее.
# Значения больше 1.5 могут выглядеть размыто.
pet_scale = 1.0

# Где появляется питомец при запуске. Варианты: bottom-center, bottom-left,
# bottom-right.
pet_start_position = "bottom-right"

# true — окно покрывает все мониторы; false — только основной. Клики мимо
# питомца всё равно уходят в приложения под ним.
pet_span_all_screens = true

# Скорость анимации покоя, кадров в секунду.
idle_fps = 13.0

# Скорость анимации перетаскивания.
drag_fps = 14.0

# Скорость анимации приземления. Больше — короче и резче.
fall_fps = 22.0

# Интервал игрового цикла в миллисекундах. 16 ≈ 60 FPS. Меньше 8 не имеет
# смысла, больше 33 — рывки.
tick_interval_ms = 16

# Порог скорости курсора (px/s), выше которого питомец ускоряется (играет
# анимацию 1-2-3).
speed_start = 350.0

# Порог скорости курсора (px/s), ниже которого питомец тормозит (играет
# анимацию 3-4-5).
speed_stop = 120.0

# Если мышь не двигалась столько миллисекунд — скорость считается нулевой.
# Питомец возвращается в покой даже с зажатой кнопкой мыши.
speed_zero_ms = 80

# Минимальная горизонтальная скорость (px/s), при которой меняется
# направление спрайта (влево/вправо).
direction_min_speed = 50.0

# Сглаживание скорости курсора (EMA). 0.5 — компромисс. Меньше — плавнее,
# больше — резче.
speed_ema_alpha = 0.5

# Ускорение свободного падения, px/s². Больше — падает быстрее. 2500 —
# падение с 400 px занимает около 0.55 с.
gravity = 2500.0

# Максимальная скорость падения, px/s. Обрезает разгон, чтобы с большой
# высоты питомец не телепортировался.
max_fall_speed = 2200.0
