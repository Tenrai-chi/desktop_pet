# Простые голосовые команды.
# triggers — фразы, которые надо распознать (без учета регистра).
# action — действие: "launch" (запустить прогу), "url" (открыть сайт), "exit" (выключить питомца), "reply" (просто ответить).
# target — путь к exe (для launch) или URL (для url).
# reply — что питомец скажет в ответ.


# ПРИЛОЖЕНИЯ
[commands.steam]
triggers = ["включи стим", "открой стим", "запусти стим"]
action = "launch"
target = "C:\\Program Files (x86)\\Steam\\steam.exe"
reply = ["Открываю Steam", "Готов играть?", "Отлетаем как очередняры", "Будем жестко сосать в рокетлиге?", "50 часов сборки модиков сталкера"]

[commands.calculator]
triggers = ["включи калькулятор", "открой калькулятор", "калькулятор"]
action = "launch"
target = "C:\\Windows\\System32\\calc.exe"
reply = ["Открываю калькулятор", "сам посчитать уже не можешь?", "Начинай считать от 100 до 1", "Сколько? не мало..."]

[commands.notepad]
triggers = ["включи блокнот", "открой блокнот", "блокнот"]
action = "launch"
target = "C:\\Windows\\System32\\notepad.exe"
replies = ["Открываю блокнот", "Пишем?", "Ууууу, заметочки", "Ура, новые секреты"]

[commands.explorer]
triggers = ["открой проводник", "включи проводник", "проводник"]
action = "launch"
target = "C:\\Windows\\explorer.exe"
replies = ["Открываю проводник", "Опять эти папки...", "Посмотрим отчеты по зарплате?)"]

[commands.telegram]
triggers = ["включи телеграм", "открой телеграм", "телеграм", "телега"]
action = "launch"
target = "C:\\Users\\%USERNAME%\\AppData\\Roaming\\Telegram Desktop\\Telegram.exe"
replies = ["Открываю Telegram", "Кто там пишет?", "Ответим фанатам?", "опять Миша пишет?", "Будем смотреть аниме девочек в купальнике?", "Новости в телеграмме... Я старая"]

[commands.discord]
triggers = ["включи дискорд", "открой дискорд", "дискорд"]
action = "launch"
target = "C:\\Users\\%USERNAME%\\AppData\\Local\\Discord\\Update.exe --processStart Discord.exe"
replies = ["Открываю Discord", "Кого слушаем?", "Будет серьезный разговор?", "Ты ж ни с кем не общаешься....", "Пупупу... а звонить-то некому..."]


# САЙТЫ
[commands.youtube]
triggers = ["включи ютуб", "открой ютуб", "ютуб"]
